<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>과제 가이드 영상 제작기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
:root{--bg:#eef1f5;--panel:#fff;--ink:#15213a;--muted:#5a6680;--line:#d8dee8;--accent:#1f5fd6;--on:#fff;--err:#c93636}
@media (prefers-color-scheme:dark){:root{--bg:#0c111c;--panel:#151c2b;--ink:#e5eaf3;--muted:#93a0b8;--line:#273249;--accent:#5b8ef0;--on:#0c111c;--err:#f07070;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;padding:16px}
form{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:12px}
h1{font-size:20px;margin:0}
p{margin:0;color:var(--muted);font-size:13.5px}
input[type=password]{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
button{font:inherit;font-weight:600;padding:9px;border-radius:6px;border:0;background:var(--accent);color:var(--on);cursor:pointer}
button:disabled{opacity:.5}
.err{color:var(--err);min-height:1.4em;font-size:13px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
</style>
</head>
<body>
<form id="f">
  <h1>과제 가이드 영상 제작기</h1>
  <p>팀 내부용 페이지입니다. 비밀번호를 입력하세요.</p>
  <input type="password" id="pw" autocomplete="current-password" aria-label="비밀번호" autofocus>
  <label><input type="checkbox" id="keep"> 이 컴퓨터에서 비밀번호 기억하기</label>
  <button id="go">열기</button>
  <div class="err" id="err" role="alert"></div>
</form>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(IV)},key,b(DATA));
  return new TextDecoder().decode(plain);
}
function show(html){ document.open(); document.write(html); document.close(); }
(async()=>{ let saved=null; try{saved=localStorage.getItem(KEY);}catch(e){}
  if(saved){ try{ show(await unlock(saved)); return; }catch(e){ try{localStorage.removeItem(KEY);}catch(_){} } } })();
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault(); const pw=document.getElementById("pw").value, btn=document.getElementById("go"), err=document.getElementById("err");
  if(!pw){ err.textContent="비밀번호를 입력하세요."; return; }
  btn.disabled=true; err.textContent="";
  try{ const html=await unlock(pw);
    if(document.getElementById("keep").checked){ try{localStorage.setItem(KEY,pw);}catch(_){} }
    show(html);
  }catch(_){ err.textContent="비밀번호가 맞지 않습니다. 다시 입력하세요."; btn.disabled=false; document.getElementById("pw").select(); }
});
